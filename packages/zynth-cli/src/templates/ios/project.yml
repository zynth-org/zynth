name: {{APP_NAME}}
options:
  minimumXcodeGenVersion: 2.38.0
  shared: true
  deploymentTarget:
    iOS: "15.1"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
    MARKETING_VERSION: {{VERSION}}
    CURRENT_PROJECT_VERSION: {{BUILD_NUMBER}}
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Podfile
          - Podfile.lock
          - Manifest.lock
          - Pods/**
          - "{{APP_NAME}}.xcworkspace/**"
          - Info.plist
          - build/**
          - .build/**
          - .xcodegen/**
    info:
      path: Info.plist
      properties:
        # Use a storyboard-based launch screen to control image content mode.
        UILaunchStoryboardName: LaunchScreen
        # Avoid archive warning when iPad multitasking is allowed.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
{{UI_APP_FONTS}}
{{INFO_PLIST_PROPERTIES}}
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    preBuildScripts:
      - name: BundleJS
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../dist/main.js
          - $(SRCROOT)/../dist/main.hbc
          - $(SRCROOT)/../dist/assets/images-manifest.json
        outputFiles:
          - $(DERIVED_FILE_DIR)/BundleJS.stamp
        script: |
          # Exit immediately if a command exits with a non-zero status.
          set -e

          # ✅ Navigate from the Xcode project dir to the root of your framework.
          cd "$PROJECT_DIR/../../../"

          # Check if bundle already exists and we're in Release mode
          BUNDLE_PATH="apps/{{APP_DIR}}/dist/main.js"
          mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"

          FONTS_DIR="$PROJECT_DIR/{{APP_NAME}}/fonts"
          if [ -d "$FONTS_DIR" ]; then
            echo "🔤 Copying bundled fonts from $FONTS_DIR..."
            DEST_FONTS_DIR="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fonts"
            mkdir -p "$DEST_FONTS_DIR"
            cp "$FONTS_DIR"/* "$DEST_FONTS_DIR/" 2>/dev/null || true
            echo "  ✓ Fonts copied"
          fi

          IMAGES_DIR="$PROJECT_DIR/{{APP_NAME}}/images"
          if [ -d "$IMAGES_DIR" ]; then
            echo "🖼️ Copying bundled images from $IMAGES_DIR..."
            DEST_IMAGES_DIR="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/images"
            mkdir -p "$DEST_IMAGES_DIR"
            cp "$IMAGES_DIR"/* "$DEST_IMAGES_DIR/" 2>/dev/null || true
            echo "  ✓ Images copied"
          fi

          if [ "$CONFIGURATION" = "Release" ]; then
            echo "⚡ Release build detected - using pre-built bundle"
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "---" >&2
              echo "FATAL ERROR: JS bundle not found at $BUNDLE_PATH" >&2
              echo "For Release builds, you must build the bundle first:" >&2
              echo "  yarn workspace {{WORKSPACE_NAME}} build" >&2
              echo "Or use: zynth build ios" >&2
              echo "---" >&2
              exit 1
            fi
          else
            echo "⚡ Debug build - skipping bundle copy (Rsbuild dev server supplies JS)."
            rm -f "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.js"
            rm -f "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.hbc"
            touch "${SCRIPT_OUTPUT_FILE_0}"
            exit 0
          fi

          # Prefer Hermes bytecode in Release and omit JS source to reduce app size.
          HBC_PATH="apps/{{APP_DIR}}/dist/main.hbc"
          if [ -f "$HBC_PATH" ]; then
            echo "📦 Copying Hermes bytecode..."
            cp "$HBC_PATH" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.hbc"
            rm -f "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.js"
          else
            echo "📄 Hermes bytecode missing; copying main.js fallback..."
            rm -f "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.hbc"
            cp "$BUNDLE_PATH" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.js"
          fi

          # Copy bundled image assets discovered during JS build (Shell-only approach)
          ASSETS_DIR="apps/{{APP_DIR}}/dist/assets"
          if [ -d "$ASSETS_DIR" ]; then
            echo "🖼️ Copying bundled image assets from $ASSETS_DIR..."
            DEST_ASSETS_DIR="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/assets"
            mkdir -p "$DEST_ASSETS_DIR"
            cp -R "$ASSETS_DIR/" "$DEST_ASSETS_DIR/"
            echo "  ✓ Assets copied"
          fi

          touch "${SCRIPT_OUTPUT_FILE_0}"
    dependencies:
      - sdk: JavaScriptCore.framework
schemes:
  {{APP_NAME}}:
    build:
      targets:
        {{APP_NAME}}: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
