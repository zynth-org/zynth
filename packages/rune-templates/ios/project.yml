name: {{APP_NAME}}
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Podfile
          - Podfile.lock
          - Manifest.lock
          - Pods/**
          - "{{APP_NAME}}.xcworkspace/**"
          - Info.plist
          - build/**
          - .build/**
          - .xcodegen/**
    info:
      path: Info.plist
      properties:
        # Ensure a proper full-screen window is created before app code runs.
        # Using an asset-based launch screen avoids storyboard compilation.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
    prebuildScripts:
      - name: BundleJS
        basedOnDependencyAnalysis: false
        script: |
          # Exit immediately if a command exits with a non-zero status.
          set -e

          # 🎯 FIX: Explicitly set the PATH for NVM-managed executables.
          # You must use the directory containing the 'node' and 'yarn' binaries.
          # WARNING: If you change your Node version using NVM, you must update the version number here!
          export PATH="/Users/ignaciozsabo/.nvm/versions/node/v22.20.0/bin:$PATH"

          # 💡 Optional robust check:
          # Use 'command -v' to check if 'yarn' is now available and fail the build otherwise.
          command -v yarn >/dev/null 2>&1 || {
            echo "---" >&2
            echo "FATAL ERROR: 'yarn' command not found in the Xcode build environment." >&2
            echo "Please verify the following path in your project.yml file is correct:" >&2
            echo "Path: /Users/ignaciozsabo/.nvm/versions/node/v22.20.0/bin" >&2
            echo "---" >&2
            exit 1
          }

          # ✅ Navigate from the Xcode project dir to the root of your framework.
          cd "$PROJECT_DIR/../../../"

          # Run the build commands.
          echo "Bundling workspace packages..."
          yarn bundle:packages
          echo "Bundling app workspace..."
          yarn workspace {{WORKSPACE_NAME}} build

          # Copy the generated JS bundle into the app's resources folder.
          echo "Copying main.js to app resources..."
          mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "apps/{{APP_DIR}}/dist/main.js" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.js"
    dependencies:
      - sdk: JavaScriptCore.framework
